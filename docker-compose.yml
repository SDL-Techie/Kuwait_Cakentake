services:
  cakentake:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${PUBLIC_APP_URL:?Set PUBLIC_APP_URL in the root .env file}
        VITE_N8N_CHAT_WEBHOOK_URL: ${N8N_CHAT_WEBHOOK_URL:-}
    env_file:
      - .env
    environment:
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-5432}
      API_BASE_URL: ${PUBLIC_APP_URL}
      WEB_APP_URL: ${PUBLIC_APP_URL}
      CORS_ORIGINS: ${PUBLIC_APP_URL}
      FLASK_APP: app.py
      FLASK_DEBUG: "0"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_PORT:-5000}:5000"
    restart: unless-stopped